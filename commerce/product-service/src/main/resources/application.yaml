spring:
  application:
    name: product-service
  config:
    import: ${CONFIG_IMPORT:configserver:}
  cloud:
    config:
      discovery:
        enabled: ${CONFIG_DISCOVERY_ENABLED:true}
        serviceId: config-server
      fail-fast: ${CONFIG_FAIL_FAST:true}
      retry:
        use-random-policy: ${CONFIG_RETRY_RANDOM:true}
        max-interval: ${CONFIG_RETRY_MAX_INTERVAL:6000}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    enabled: ${EUREKA_ENABLED:true}